version: 2.1

# Pipeline parameters let you trigger a mirror run from the CircleCI API or UI.
# See README.md → "Triggering a sync by hand".
parameters:
  run_mirror:
    type: boolean
    default: false
    description: "Run the mirror job now"
  min_version:
    type: string
    default: ""
    description: "Skip tags older than this WordPress version (e.g. 6.0)"
  only_refs:
    type: string
    default: ""
    description: "Comma-separated upstream refs to mirror (e.g. 6.9.1,6.9-branch)"
  force:
    type: boolean
    default: false
    description: "Rebuild tags that already exist on the target"

executors:
  default:
    docker:
      - image: cimg/python:3.12
    resource_class: medium
    environment:
      TARGET_REPO_SLUG: kanopi/wordpress-core
      TOOLING_BRANCH: main
      GIT_TERMINAL_PROMPT: "0"
  php:
    docker:
      - image: cimg/php:8.3
    resource_class: small

commands:
  clone-tooling:
    description: >
      Clone only the tooling branch. The default CircleCI `checkout` would pull
      the whole mirror (~690 MB of WordPress history), which this repo does not
      need in order to run its own scripts.
    steps:
      - run:
          name: Clone tooling branch
          command: |
            git clone --depth 1 --single-branch --branch "$TOOLING_BRANCH" \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/${TARGET_REPO_SLUG}.git" .

jobs:
  lint:
    executor: php
    steps:
      - checkout
      - run:
          name: Install shellcheck
          command: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - run:
          name: Shellcheck
          command: shellcheck bin/mirror.sh
      - run:
          name: Byte-compile the composer.json generator
          command: python3 -m py_compile bin/composer-json.py
      - run:
          name: Validate a generated composer.json
          command: |
            python3 bin/composer-json.py \
              --package kanopi/wordpress-core \
              --wp-version 6.9.1 \
              --php-version 7.2.24 \
              --installer kanopi/wp-core-installer \
              --branch-alias 'dev-6.9-branch=6.9.x-dev' \
              > /tmp/composer.json
            cd /tmp && composer validate --no-check-all --no-check-lock --strict

  mirror:
    executor: default
    steps:
      - clone-tooling
      - run:
          name: Mirror WordPress into the target repository
          command: |
            args=(--push)

            min_version="<< pipeline.parameters.min_version >>"
            if [ -n "$min_version" ]; then
              args+=(--min-version "$min_version")
            fi

            only_refs="<< pipeline.parameters.only_refs >>"
            if [ -n "$only_refs" ]; then
              args+=(--only "$only_refs")
            fi

            if [ "<< pipeline.parameters.force >>" = "true" ]; then
              args+=(--force)
            fi

            # The token stays out of the log: mirror.sh redacts credentials
            # before printing the target URL.
            export TARGET_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${TARGET_REPO_SLUG}.git"
            export SOURCE_URL="https://github.com/${TARGET_REPO_SLUG}"

            bin/mirror.sh "${args[@]}"
          no_output_timeout: 90m

workflows:
  # Runs when a pipeline sets run_mirror=true. That comes from either the
  # scheduled pipeline configured in the CircleCI UI (Project Settings →
  # Triggers) or a manual API/UI trigger. Schedules are deliberately NOT
  # declared here — CircleCI no longer honours cron triggers from config.yml.
  sync:
    when: << pipeline.parameters.run_mirror >>
    jobs:
      - mirror:
          context: github-push

  # Ordinary pushes to the tooling branch only lint. Pushes to mirrored refs
  # carry [skip ci] in their commit message and never reach CircleCI.
  validate:
    when:
      and:
        - not: << pipeline.parameters.run_mirror >>
        - equal: [main, << pipeline.git.branch >>]
    jobs:
      - lint
