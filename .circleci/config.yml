version: 2.1

orbs:
  gh: circleci/github-cli@2.3

executors:
  default:
    docker:
      - image: cimg/base:current
    resource_class: small

commands:
  setup-git:
    description: "Configure git for commits and push access"
    steps:
      - run:
          name: Configure Git
          command: |
            git config --global user.email "ci@kanopi.com"
            git config --global user.name "Kanopi CI"

            # Configure git to use GitHub token for push
            git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/kanopi/wordpress-core.git

  sync-wordpress-version:
    description: "Sync a single WordPress version"
    parameters:
      version:
        type: string
    steps:
      - run:
          name: Sync WordPress << parameters.version >>
          command: |
            ./scripts/sync-wordpress.sh "<< parameters.version >>" --push
          no_output_timeout: 10m

jobs:
  check-and-sync:
    executor: default
    steps:
      - checkout
      - setup-git
      - run:
          name: Install dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y jq curl

      - run:
          name: Check for new WordPress versions
          command: |
            # Fetch all WordPress tags from GitHub
            echo "Fetching WordPress versions from GitHub..."
            WORDPRESS_VERSIONS=$(curl -sL "https://api.github.com/repos/WordPress/WordPress/tags?per_page=100" | \
              jq -r '.[].name' | \
              grep -E '^[0-9]+\.[0-9]+(\.[0-9]+)?$' | \
              sort -V)

            # Fetch our existing tags
            echo "Fetching existing tags..."
            git fetch --tags
            OUR_TAGS=$(git tag -l | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V)

            # Find versions we don't have (only sync 6.0+)
            echo "Comparing versions..."
            NEW_VERSIONS=""
            for version in $WORDPRESS_VERSIONS; do
              # Normalize version (6.5 -> 6.5.0)
              if [[ "$version" =~ ^([0-9]+)\.([0-9]+)$ ]]; then
                normalized="${version}.0"
              else
                normalized="$version"
              fi

              # Check if >= 6.0
              major=$(echo "$version" | cut -d. -f1)
              minor=$(echo "$version" | cut -d. -f2)
              if [[ $major -lt 6 ]]; then
                continue
              fi

              # Check if we already have this version
              if ! echo "$OUR_TAGS" | grep -q "^${normalized}$"; then
                NEW_VERSIONS="$NEW_VERSIONS $version"
                echo "New version found: $version (tag: $normalized)"
              fi
            done

            if [[ -z "$NEW_VERSIONS" ]]; then
              echo "No new WordPress versions to sync"
              echo "export NEW_VERSIONS=''" >> $BASH_ENV
            else
              echo "New versions to sync: $NEW_VERSIONS"
              echo "export NEW_VERSIONS='$NEW_VERSIONS'" >> $BASH_ENV
            fi

      - run:
          name: Sync new versions
          command: |
            if [[ -z "$NEW_VERSIONS" ]]; then
              echo "No new versions to sync, skipping"
              exit 0
            fi

            # Fetch all branches
            git fetch --all

            for version in $NEW_VERSIONS; do
              echo "========================================"
              echo "Syncing WordPress $version"
              echo "========================================"

              # Get branch name (major.minor.x)
              major_minor=$(echo "$version" | grep -oE '^[0-9]+\.[0-9]+')
              branch="${major_minor}.x"

              # Checkout or create branch
              if git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
                git checkout -B "$branch" "origin/$branch"
              else
                git checkout main
                git checkout -b "$branch"
              fi

              # Run sync script
              ./scripts/sync-wordpress.sh "$version" --push || {
                echo "Failed to sync $version, continuing..."
                git checkout main
                continue
              }

              # Return to main for next iteration
              git checkout main
            done

          no_output_timeout: 30m

  sync-single-version:
    executor: default
    parameters:
      version:
        type: string
        description: "WordPress version to sync (e.g., 6.4.3)"
      include_prerelease:
        type: boolean
        default: false
        description: "Include pre-release versions"
    steps:
      - checkout
      - setup-git
      - run:
          name: Sync WordPress << parameters.version >>
          command: |
            VERSION="<< parameters.version >>"

            # Get branch name
            major_minor=$(echo "$VERSION" | grep -oE '^[0-9]+\.[0-9]+')
            branch="${major_minor}.x"

            # Checkout or create branch
            git fetch --all --tags
            if git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
              git checkout -B "$branch" "origin/$branch"
            else
              git checkout main
              git checkout -b "$branch"
            fi

            # Run sync script
            ./scripts/sync-wordpress.sh "$VERSION" --push

  sync-all-versions:
    executor: default
    parameters:
      min_version:
        type: string
        default: "6.0"
        description: "Minimum WordPress version to sync"
      include_prerelease:
        type: boolean
        default: false
        description: "Include pre-release versions"
    steps:
      - checkout
      - setup-git
      - run:
          name: Fetch all branches and tags
          command: |
            git fetch --all --tags
      - run:
          name: Sync all WordPress versions
          command: |
            ARGS="--min-version << parameters.min_version >> --push"
            if [[ "<< parameters.include_prerelease >>" == "true" ]]; then
              ARGS="$ARGS --include-prerelease"
            fi
            ./scripts/sync-all-versions.sh $ARGS
          no_output_timeout: 60m

workflows:
  # Daily check for new WordPress versions
  daily-sync:
    triggers:
      - schedule:
          cron: "0 6 * * *"  # 6 AM UTC daily
          filters:
            branches:
              only:
                - main
    jobs:
      - check-and-sync:
          context: github-push

  # Manual trigger for syncing a specific version
  manual-sync-version:
    when:
      and:
        - equal: [ true, << pipeline.parameters.sync_version >> ]
    jobs:
      - sync-single-version:
          version: << pipeline.parameters.wordpress_version >>
          context: github-push

  # Manual trigger for syncing all versions
  manual-sync-all:
    when:
      and:
        - equal: [ true, << pipeline.parameters.sync_all >> ]
    jobs:
      - sync-all-versions:
          min_version: << pipeline.parameters.min_version >>
          include_prerelease: << pipeline.parameters.include_prerelease >>
          context: github-push

# Pipeline parameters for manual triggers
parameters:
  sync_version:
    type: boolean
    default: false
  wordpress_version:
    type: string
    default: ""
  sync_all:
    type: boolean
    default: false
  min_version:
    type: string
    default: "6.0"
  include_prerelease:
    type: boolean
    default: false
